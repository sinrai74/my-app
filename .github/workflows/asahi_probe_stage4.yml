# 朝刊AI 新モデル 第4段階 調査 run（読み取り専用のデータ検証）
# - 調査ブランチ asahi-probe-stage4 への push でのみ動く（main・既存 workflow には影響しない）
# - 公式 B/K ファイルを 3 秒間隔で取得し、固定長定義での解析・件数検査・motor_history 照合を行う
# - リポジトリへの書き込み・通知・本番データの変更はしない（contents: read）
name: "Asahi AI stage4 probe (read-only data check)"

on:
  push:
    branches: [asahi-probe-stage4]
    paths:
      - "asahi_probe/**"
      - ".github/workflows/asahi_probe_stage4.yml"

permissions:
  contents: read

concurrency:
  group: asahi-probe-stage4
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.9"

      - name: Install dependencies
        run: python -m pip install --quiet pandas numpy

      - name: Run probe
        run: python -u asahi_probe/probe_stage4.py --out probe_out

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: asahi-probe-stage4
          path: |
            probe_out/summary.json
            probe_out/per_day.json
            probe_out/raw
          retention-days: 30
