# 正式G2：評価（G2 独立経路。P11・判断C・M7）
#
# - 起動は workflow_dispatch だけ（schedule・push などは持たない）。
# - 評価ジョブのどのステップにも GITHUB_TOKEN を渡さない（§6.8 B の条件1・3・6。07g・2026-11-05/06 の GPT 判断）。
#   actions/checkout は token が必須の入力なので使わない。ソースは公開リポジトリから匿名で取得する。
#   setup-python には token: "" を明示する（既定値の github.token を使わせない）。
# - 評価ジョブはリポジトリ取得用の認証情報を作成・使用・保持しない（条件5）。取得のステップの中で確かめる。
# - 権限は permissions: {}（GITHUB_TOKEN に権限を与えない）。出力は artifact だけ（Release・Cache・commit をしない）。
# - アクションは40桁のコミット SHA で固定する（setup-python v5.6.0、upload-artifact v4.6.2）。
# - 加算・連続数は判定しない（集約は formal_g2_aggregate.yml で行う）。
# - G2 のスクリプトが無いブランチ（例：スクリプトを含まない main）で起動された場合は、
#   何もせずに終わる。

name: formal-g2-evaluate

on:
  workflow_dispatch:
    inputs:
      race_date:
        description: "対象の race_date（YYYYMMDD）"
        required: true
      mode:
        description: "investigation（調査用）または formal（正式。個別の開始許可が必要）"
        required: true
        type: choice
        options:
          - investigation
          - formal
      permission_id:
        description: "個別の開始許可の識別子（formal のとき必須）"
        required: false
        default: ""
      baseline_path:
        description: "登録済みの基準 JSON のリポジトリ内パス（formal のとき必須）"
        required: false
        default: ""

permissions: {}

concurrency:
  group: formal-g2-evaluate
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch source anonymously
        shell: bash
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init -q .
          git -c credential.helper= -c protocol.version=2 fetch --no-tags --depth=1 "https://github.com/${REPO}.git" "${SHA}"
          git -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
          head="$(git rev-parse HEAD)"
          if [ "${head}" != "${SHA}" ]; then echo "fetched HEAD ${head} does not match GITHUB_SHA ${SHA}"; exit 1; fi
          if [ -n "$(git status --porcelain)" ]; then echo "working tree is not clean"; exit 1; fi
          creds="$(git config --show-origin --get-regexp '^(http\..*\.extraheader|http\.extraheader|credential\..*|url\..*\.insteadof)$' || true)"
          if [ -n "${creds}" ]; then echo "credential settings are present"; exit 1; fi
          if [ -e "${HOME}/.git-credentials" ] || [ -n "${GIT_ASKPASS:-}" ]; then
            echo "credential material is present"; exit 1
          fi
          if env | grep -qiE '^[^=]*token[^=]*='; then echo "token-like environment variable is present"; exit 1; fi
          echo "g2_credentials_check=none"
          echo "g2_fetch_head=${head}"

      - name: Check G2 script presence
        id: presence
        shell: bash
        run: |
          if [ -f rebuild/formal_g2/evaluate_main.py ] && [ -f requirements-g2.lock ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "G2 scripts are not on this ref; nothing to do."
          fi

      - name: Set up Python
        if: steps.presence.outputs.present == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.9"
          token: ""

      - name: Install locked dependencies
        if: steps.presence.outputs.present == 'true'
        shell: bash
        run: |
          python -m pip install --no-deps "pip==24.2" "setuptools==75.1.0" "wheel==0.44.0"
          python -m pip install --no-deps -r requirements-g2.lock

      - name: Evaluate
        if: steps.presence.outputs.present == 'true'
        shell: bash
        env:
          RACE_DATE: ${{ inputs.race_date }}
          MODE: ${{ inputs.mode }}
          PERMISSION_ID: ${{ inputs.permission_id }}
          BASELINE_PATH: ${{ inputs.baseline_path }}
        run: |
          args=(--race-date "$RACE_DATE" --mode "$MODE" --out g2_out)
          if [ -n "$PERMISSION_ID" ]; then args+=(--permission-id "$PERMISSION_ID"); fi
          if [ -n "$BASELINE_PATH" ]; then args+=(--baseline "$BASELINE_PATH"); fi
          PYTHONPATH="${GITHUB_WORKSPACE}/rebuild:${GITHUB_WORKSPACE}" \
            python -P -B -m formal_g2.evaluate_main "${args[@]}"

      - name: Upload evidence
        id: upload
        if: always() && steps.presence.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g2-${{ inputs.race_date }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: g2_out/
          retention-days: 90
          if-no-files-found: error

      - name: Record artifact digest
        if: always() && steps.presence.outputs.present == 'true'
        shell: bash
        env:
          DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          echo "artifact_id=${ARTIFACT_ID}"
          echo "artifact_digest=${DIGEST}"
