name: 週次モデル再学習

on:
  # 毎週月曜日 JST 3:00 (UTC 18:00 日曜)に実行
  schedule:
    - cron: "0 18 * * 0"

  # 手動実行
  workflow_dispatch:
    inputs:
      weeks_back:
        description: "何週間分のデータを使うか"
        required: false
        default: "4"

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 【バグ修正】バージョン指定が無く、実行のたびに最新の
          # scikit-learn/lightgbmが入っていた。学習(ここ)と予測
          # (notify_arashi.yml等)でscikit-learnのバージョンが食い違うと、
          # 内部モジュール構造の変更(例: _loss)によりモデルの読み込みが
          # 壊れる。学習・予測すべてのワークフローで同一バージョンに固定する。
          pip install requests beautifulsoup4 pandas numpy "scikit-learn==1.5.2" "lightgbm==4.5.0"
          # 7z インストール
          sudo apt-get install -y p7zip-full

      - name: Run retraining
        run: |
          WEEKS="${{ github.event.inputs.weeks_back }}"
          if [ -z "$WEEKS" ]; then
            WEEKS="4"
          fi
          set -o pipefail
          python retrain.py 2>&1 | tee retrain_log.txt

      # 手動実行（検証用）では main へ commit せず、モデルとログを artifact に保存する
      # （docs/上位判断記録_再学習ラベル混在_20261012.md D3-3）
      - name: Upload model as artifact (manual run)
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: retrain-model-${{ github.run_id }}
          path: |
            model_all.pkl
            retrain_log.txt
          retention-days: 14
          if-no-files-found: error

      - name: Commit updated model
        if: github.event_name == 'schedule'
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add model_all.pkl
          git diff --staged --quiet || git commit -m "auto retrain model $(date '+%Y-%m-%d') [skip ci]"
          git push
