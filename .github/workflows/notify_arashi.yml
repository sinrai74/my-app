name: ボートレース荒れ検知 (15分ごと)

on:
  # ── 15分ごとの自動実行（UTC: 日本時間 -9h）──────────────────
  # 日本の開催時間帯（JST 8:00〜22:00）に絞る
  # UTC 23:00 〜 13:00 = JST 8:00 〜 22:00
  schedule:
    - cron: "0,15,30,45 23 * * *"
    - cron: "0,10,20,30,40,50 0-4 * * *"
    - cron: "0,15,30,45 5-12 * * *"
    - cron: "0 13 * * *"

  # ── 手動実行（デバッグ用）──────────────────────────────────
  workflow_dispatch:
    inputs:
      race_date:
        description: "対象日付 YYYYMMDD（空欄で今日）"
        required: false
        default: ""
      threshold:
        description: "荒れスコア閾値（デフォルト: 3.0）"
        required: false
        default: "4.0"
      skip_filter:
        description: "締切チェック無効化 (1=無効)"
        required: false
        default: "0"

# ── 同時実行の防止 ──
concurrency:
  group: notify-arashi
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # 20分でタイムアウト（手動実行が時間内に完了しない問題を解消。自動実行は15分ごとだが、GitHub Actions側で同時実行数に空きがあれば並行して動けるため、通常は大きな問題にならない）

    steps:
      # ── リポジトリを取得 ─────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # ── Python セットアップ ──────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 依存ライブラリのインストール ─────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas numpy "scikit-learn==1.5.2" "lightgbm==4.5.0"

      # ── 前日の sent ファイルを Release から取り戻す（hit_record の結果照合用）──
      # 実行環境は毎回使い捨てのため、これが無いと前日分の照合が常に行われない。
      # 失敗しても notify の実行は止めない（x_state_sync.py は常に終了コード0）。
      - name: Restore sent file (state sync)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RACE_DATE: ${{ github.event.inputs.race_date }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT_RACE_DATE" ]; then
            python x_state_sync.py restore --date "$INPUT_RACE_DATE"
          else
            python x_state_sync.py restore
          fi

      # ── 荒れ検知スクリプト実行 ──────────────────────────────
      - name: Run upset detector
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          SKIP_TIME_FILTER: ${{ github.event.inputs.skip_filter }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE_ARG=""
          THRESHOLD_ARG=""

          # 手動実行時は入力値を使用
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.race_date }}" ]; then
              DATE_ARG="--date ${{ github.event.inputs.race_date }}"
            fi
            if [ -n "${{ github.event.inputs.threshold }}" ]; then
              THRESHOLD_ARG="--threshold ${{ github.event.inputs.threshold }}"
            fi
          fi

          python notify_arashi.py $DATE_ARG $THRESHOLD_ARG

      # ── 当日の sent ファイルを Release へ保存する（翌日の結果照合用）──
      # notify が途中で失敗した場合も、それまでに書いた分を保存する。
      - name: Save sent file (state sync)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python x_state_sync.py save

      # ── 失敗時のログ保存（デバッグ用）──────────────────────
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ github.run_id }}
          path: "*.log"
          retention-days: 7
