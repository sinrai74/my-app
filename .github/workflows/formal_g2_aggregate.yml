# 正式G2：集約・証拠照合（C-6）
#
# - 起動は workflow_dispatch だけ。
# - 評価コード・Legacy のコードは読み込まない（集約スクリプトは標準ライブラリだけを使う）。
# - artifact の取得に actions: read を使う。書き込み権限は持たない。
# - 出力は artifact だけ。証拠の長期保存は、人の許可を得た commit で行う（このworkflowは commit しない）。
# - M7-3：評価ジョブのログ原本を actions: read で取得し、Runner Image の値を照合する。
#   トークンを使うのはこの集約ジョブだけで、評価の workflow・プロセスには渡さない（C-4）。
# - 照合に失敗した実行が1件でもあれば Aggregate のステップは失敗する（結果は upload される）。

name: formal-g2-aggregate

on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: "集約する評価の run_id（空白区切り）"
        required: true
      first_date:
        description: "対象期間の最初の race_date（YYYYMMDD）"
        required: true
      last_date:
        description: "対象期間の最後の race_date（YYYYMMDD）"
        required: true
      permissions_path:
        description: "開始許可の一覧 JSON のリポジトリ内パス（空なら正式な実行は0件として扱う）"
        required: false
        default: ""
      baseline_path:
        description: "登録済みの基準 JSON のリポジトリ内パス（空なら M7-3 を照合できず、正式な実行は加算しない）"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: formal-g2-aggregate
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check aggregator presence
        id: presence
        shell: bash
        run: |
          if [ -f rebuild/formal_g2/aggregate/main.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "G2 aggregator is not on this ref; nothing to do."
          fi

      - name: Set up Python
        if: steps.presence.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Download artifacts (zip) and digests
        if: steps.presence.outputs.present == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS: ${{ inputs.run_ids }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p g2_artifacts
          for rid in $RUN_IDS; do
            case "$rid" in (*[!0-9]*|'') echo "invalid run id: $rid"; exit 1;; esac
            attempt=$(gh api "repos/${REPO}/actions/runs/${rid}" --jq '.run_attempt')
            gh api "repos/${REPO}/actions/runs/${rid}/artifacts" \
              --jq '.artifacts[] | select(.name | startswith("g2-")) | select(.name | startswith("g2-aggregate-") | not) | [.id, .name, (.digest // "")] | @tsv' |
            while IFS=$'\t' read -r aid aname adigest; do
              att="${aname##*-}"
              case "$att" in (*[!0-9]*|'') echo "unexpected artifact name: $aname"; exit 1;; esac
              started=$(gh api "repos/${REPO}/actions/runs/${rid}/attempts/${att}" --jq '.run_started_at')
              d="g2_artifacts/${rid}-${att}"
              mkdir -p "$d"
              gh api "repos/${REPO}/actions/artifacts/${aid}/zip" > "$d/artifact.zip"
              # M7-3：評価ジョブのログ原本を取得する（失敗しても止めず、失敗として記録する）。
              # エラー文は署名付き URL の問い合わせ部分を伏せて1行だけ残す。
              jids=$(gh api "repos/${REPO}/actions/runs/${rid}/attempts/${att}/jobs" \
                       --jq '[.jobs[] | select(.name == "evaluate") | .id | tostring] | join(" ")' 2> "$d/jobs.err") \
                || jids=""
              set -- $jids
              job_count=$#
              job_id=""; log_ok=false; log_err=""; log_sha=""; log_bytes=""
              fetched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              if [ "$job_count" -eq 1 ]; then
                job_id="$1"
                # 2段階で取得する（API は 302 まで。署名付き URL には Authorization を付けない）。
                # 原本のバイト列をそのまま保存する。署名付き URL・トークンは記録しない。
                PYTHONPATH="${GITHUB_WORKSPACE}/rebuild" python -P -B -m formal_g2.aggregate.fetch_log \
                  --repo "$REPO" --job-id "$job_id" --out "$d/job.log" --result "$d/fetch.json"
                if [ "$(jq -r '.ok' "$d/fetch.json")" = "true" ]; then
                  log_ok=true
                  log_sha=$(sha256sum "$d/job.log" | cut -d' ' -f1)
                  log_bytes=$(stat -c %s "$d/job.log")
                  if [ "$log_sha" != "$(jq -r '.sha256' "$d/fetch.json")" ]; then
                    log_ok=false; log_err="log sha256 changed after fetch"
                  fi
                else
                  log_err=$(jq -r '"\(.error) (api_status=\(.api_status), download_status=\(.download_status), host=\(.download_host))"' "$d/fetch.json" | cut -c1-300)
                  rm -f "$d/job.log"
                fi
                rm -f "$d/fetch.json"
              else
                log_err="evaluate job count = ${job_count} (expected 1)"
              fi
              rm -f "$d/jobs.err"
              jq -n --arg run_id "$rid" --arg run_attempt "$att" --arg name "$aname" \
                    --arg digest "$adigest" --arg started "$started" --arg latest_attempt "$attempt" \
                    --arg job_id "$job_id" --argjson job_count "$job_count" --argjson log_ok "$log_ok" \
                    --arg log_err "$log_err" --arg log_sha "$log_sha" --arg log_bytes "$log_bytes" \
                    --arg fetched_at "$fetched_at" \
                '{run_id:$run_id, run_attempt:$run_attempt, artifact_name:$name,
                  expected_digest:$digest, run_started_at:$started, latest_attempt:$latest_attempt,
                  job_id:$job_id, job_count:$job_count, log_fetch_ok:$log_ok,
                  log_fetch_error:(if $log_err == "" then null else $log_err end),
                  log_file:(if $log_ok then "job.log" else null end),
                  log_sha256:(if $log_sha == "" then null else $log_sha end),
                  log_bytes:(if $log_bytes == "" then null else ($log_bytes | tonumber) end),
                  log_fetched_at:$fetched_at}' \
                > "$d/meta.json"
            done
          done

      - name: Aggregate
        if: steps.presence.outputs.present == 'true'
        shell: bash
        env:
          FIRST_DATE: ${{ inputs.first_date }}
          LAST_DATE: ${{ inputs.last_date }}
          PERMISSIONS_PATH: ${{ inputs.permissions_path }}
          BASELINE_PATH: ${{ inputs.baseline_path }}
        run: |
          args=(--artifacts-dir g2_artifacts --first-date "$FIRST_DATE" --last-date "$LAST_DATE" --out g2_aggregate_out)
          if [ -n "$PERMISSIONS_PATH" ]; then args+=(--permissions "$PERMISSIONS_PATH"); fi
          if [ -n "$BASELINE_PATH" ]; then args+=(--baseline "$BASELINE_PATH"); fi
          PYTHONPATH="${GITHUB_WORKSPACE}/rebuild" python -P -B -m formal_g2.aggregate.main "${args[@]}"

      - name: Upload aggregate result
        if: always() && steps.presence.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: g2-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: g2_aggregate_out/
          retention-days: 90
          if-no-files-found: error
